[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/tmp/dentissa-supervisord.pid

[program:web]
directory=/var/www/html
command=/bin/sh /var/www/html/scripts/start-web.sh
user=www-data
autostart=true
autorestart=unexpected
startsecs=3
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:telegram]
directory=/var/www/html
command=php artisan dentissa:telegram
user=www-data
autostart=true
autorestart=unexpected
startsecs=3
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
