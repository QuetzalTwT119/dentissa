name: Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, intl, pdo_mysql, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Instalar y compilar frontend
        run: |
          npm ci
          npm run build

      - name: Preparar aplicación de pruebas
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate --force
          php artisan migrate --force

      - name: Ejecutar pruebas
        run: php artisan test

      - name: Verificar espacios y conflictos de formato
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            base_sha="$BEFORE_SHA"
          else
            base_sha="$(git merge-base origin/master HEAD)"
          fi
          git diff --check "$base_sha...HEAD" -- . ':!output/pdf/*.pdf'

  test-mysql:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: dentissa_test
          MYSQL_USER: dentissa
          MYSQL_PASSWORD: dentissa_test
          MYSQL_ROOT_PASSWORD: root_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_test --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Obtener código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, intl, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Instalar dependencias PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Compilar frontend
        run: |
          npm ci
          npm run build

      - name: Preparar aplicación
        run: |
          cp .env.example .env
          php artisan key:generate --force

      # Como en un servidor real, el usuario de la app no puede crear bases:
      # la base de la restauración de prueba se prepara una vez con root.
      - name: Preparar base de restauración de prueba
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot_test -e "CREATE DATABASE IF NOT EXISTS dentissa_test_restauracion_prueba CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; GRANT ALL ON dentissa_test_restauracion_prueba.* TO 'dentissa'@'%';"

      - name: Ejecutar suite contra MySQL
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: dentissa
          DB_PASSWORD: dentissa_test
          DENTISSA_TEST_DB_CONNECTION: mysql
          DENTISSA_TEST_DB_DATABASE: dentissa_test
        run: php artisan test

      - name: Verificar espacios y conflictos de formato
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            base_sha="$BEFORE_SHA"
          else
            base_sha="$(git merge-base origin/master HEAD)"
          fi
          git diff --check "$base_sha...HEAD" -- . ':!output/pdf/*.pdf'

  build-images:
    name: build-images
    needs: [test, test-mysql]
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen de producción
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: dentissa:production-check

      - name: Construir imagen local
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.local
          push: false
          tags: dentissa:local-check

  release-gate:
    name: release-gate
    if: always()
    needs: [test, test-mysql, build-images]
    runs-on: ubuntu-latest

    steps:
      - name: Exigir pruebas y construcciones correctas
        env:
          TEST_RESULT: ${{ needs.test.result }}
          MYSQL_RESULT: ${{ needs.test-mysql.result }}
          IMAGES_RESULT: ${{ needs.build-images.result }}
        run: |
          if [ "$TEST_RESULT" != "success" ] || [ "$MYSQL_RESULT" != "success" ] || [ "$IMAGES_RESULT" != "success" ]; then
            echo "No se permite integrar: pruebas o construcción Docker fallidas."
            exit 1
          fi
          echo "Pruebas y ambas imágenes completadas correctamente."
