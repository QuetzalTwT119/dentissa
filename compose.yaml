services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"
    env_file:
      - .env
    environment:
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-dentissa}
      DB_USERNAME: ${MYSQL_USER:-dentissa}
      DB_PASSWORD: ${MYSQL_PASSWORD:-dentissa_local}
      DENTISSA_ASISTENTE_IA_HABILITADA: ${DENTISSA_ASISTENTE_IA_HABILITADA:-false}
      DENTISSA_OLLAMA_BASE_URL: ${DENTISSA_OLLAMA_BASE_URL:-http://ollama:11434}
      DENTISSA_OLLAMA_MODELO: ${DENTISSA_OLLAMA_MODELO:-granite3.3:2b}
      SESSION_CONNECTION: mysql
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # Se deja escribible para que el primer arranque pueda generar APP_KEY.
      # El archivo .env nunca debe versionarse y permanece excluido por Git.
      - ./.env:/var/www/html/.env
      - ./storage:/var/www/html/storage
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dentissa}
      MYSQL_USER: ${MYSQL_USER:-dentissa}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dentissa_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dentissa_root_local}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/02-create-test-database.sh:/docker-entrypoint-initdb.d/02-create-test-database.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Prototipo opcional: no se inicia con `docker compose up` normal.
  # Solo se activa al usar `--profile ia` y mantiene el modelo en un volumen local.
  ollama:
    image: ollama/ollama:latest
    profiles: ["ia"]
    volumes:
      - ollama_data:/root/.ollama

volumes:
  mysql_data:
  ollama_data:
