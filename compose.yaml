services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.local
      args:
        INSTALL_DEV: "true"
    env_file:
      - .env
    environment:
      APP_URL: http://localhost:8000
      # php artisan serve atiende una petición a la vez (CSS, imágenes y páginas en fila);
      # con varios trabajadores las pantallas cargan en paralelo en local.
      PHP_CLI_SERVER_WORKERS: ${PHP_CLI_SERVER_WORKERS:-4}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-dentissa}
      DB_USERNAME: ${MYSQL_USER:-dentissa}
      DB_PASSWORD: ${MYSQL_PASSWORD:-dentissa_local}
      DENTISSA_ASISTENTE_IA_HABILITADA: ${DENTISSA_ASISTENTE_IA_HABILITADA:-false}
      DENTISSA_OLLAMA_BASE_URL: ${DENTISSA_OLLAMA_BASE_URL:-http://ollama:11434}
      DENTISSA_OLLAMA_MODELO: ${DENTISSA_OLLAMA_MODELO:-granite3.3:2b}
      SESSION_CONNECTION: mysql
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-dentissa-local}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-dentissa-local-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-dentissa-local-secret}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      REVERB_CLIENT_HOST: localhost
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
      REVERB_ALLOWED_ORIGINS: localhost:8000,127.0.0.1:8000
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # Se deja escribible para que el primer arranque pueda generar APP_KEY.
      # El archivo .env nunca debe versionarse y permanece excluido por Git.
      - ./.env:/var/www/html/.env
      - ./storage:/var/www/html/storage
      # Antigravity y el navegador comparten estas piezas visuales directamente.
      # Al guardar portada o imágenes en Windows, Laravel las lee sin copiarlas.
      - ./resources/views:/var/www/html/resources/views
      - ./public/images:/var/www/html/public/images
      # Solo en desarrollo: permite que /version lea el SHA y estado exactos
      # del checkout del host. No se monta en producción.
      - ./.git:/var/www/html/.git:ro
    develop:
      watch:
        # El código PHP y las vistas se sincronizan al guardar, sin reconstruir
        # toda la imagen por cada ajuste de interfaz o lógica.
        - action: sync
          path: ./app
          target: /var/www/html/app
        - action: sync
          path: ./bootstrap
          target: /var/www/html/bootstrap
          ignore:
            - cache/
        - action: sync
          path: ./config
          target: /var/www/html/config
        - action: sync
          path: ./database
          target: /var/www/html/database
          ignore:
            - backups/
        - action: sync
          path: ./lang
          target: /var/www/html/lang
        - action: sync
          path: ./resources/views
          target: /var/www/html/resources/views
        - action: sync
          path: ./routes
          target: /var/www/html/routes
        - action: sync
          path: ./public/images
          target: /var/www/html/public/images
        # Los estilos y JavaScript se compilan dentro de la imagen con Vite.
        # Dependencias o configuración frontend también requieren reconstruir.
        - action: rebuild
          path: ./resources/css
        - action: rebuild
          path: ./resources/js
        - action: rebuild
          path: ./Dockerfile.local
        - action: rebuild
          path: ./composer.json
        - action: rebuild
          path: ./composer.lock
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json
        - action: rebuild
          path: ./postcss.config.js
        - action: rebuild
          path: ./tailwind.config.js
        - action: rebuild
          path: ./vite.config.js

  reverb:
    build:
      context: .
      dockerfile: Dockerfile.local
      args:
        INSTALL_DEV: "true"
    env_file:
      - .env
    environment:
      APP_URL: http://localhost:8000
      # php artisan serve atiende una petición a la vez (CSS, imágenes y páginas en fila);
      # con varios trabajadores las pantallas cargan en paralelo en local.
      PHP_CLI_SERVER_WORKERS: ${PHP_CLI_SERVER_WORKERS:-4}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-dentissa}
      DB_USERNAME: ${MYSQL_USER:-dentissa}
      DB_PASSWORD: ${MYSQL_PASSWORD:-dentissa_local}
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-dentissa-local}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-dentissa-local-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-dentissa-local-secret}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
      REVERB_ALLOWED_ORIGINS: localhost:8000,127.0.0.1:8000
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./.env:/var/www/html/.env
      - ./storage:/var/www/html/storage

  # Mantiene el bot de Telegram escuchando sin depender de una terminal abierta.
  # No necesita un puerto público: usa long polling hacia la API de Telegram.
  telegram:
    profiles: ["telegram"]
    build:
      context: .
      dockerfile: Dockerfile.local
      args:
        INSTALL_DEV: "true"
    env_file:
      - .env
    environment:
      APP_URL: http://localhost:8000
      # php artisan serve atiende una petición a la vez (CSS, imágenes y páginas en fila);
      # con varios trabajadores las pantallas cargan en paralelo en local.
      PHP_CLI_SERVER_WORKERS: ${PHP_CLI_SERVER_WORKERS:-4}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-dentissa}
      DB_USERNAME: ${MYSQL_USER:-dentissa}
      DB_PASSWORD: ${MYSQL_PASSWORD:-dentissa_local}
      DENTISSA_ASISTENTE_IA_HABILITADA: ${DENTISSA_ASISTENTE_IA_HABILITADA:-false}
      DENTISSA_OLLAMA_BASE_URL: ${DENTISSA_OLLAMA_BASE_URL:-http://ollama:11434}
      DENTISSA_OLLAMA_MODELO: ${DENTISSA_OLLAMA_MODELO:-granite3.3:2b}
      SESSION_CONNECTION: mysql
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-dentissa-local}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-dentissa-local-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-dentissa-local-secret}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      REVERB_CLIENT_HOST: localhost
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
      REVERB_ALLOWED_ORIGINS: localhost:8000,127.0.0.1:8000
    depends_on:
      mysql:
        condition: service_healthy
    command: ["php", "artisan", "dentissa:telegram"]
    restart: unless-stopped
    volumes:
      - ./.env:/var/www/html/.env
      - ./storage:/var/www/html/storage

  # Valida una entrega visual antes de integrarla. Se ejecuta bajo demanda:
  # docker compose --profile qa run --rm --build qa
  # No publica puertos, no usa datos clínicos y termina al acabar las pruebas.
  qa:
    profiles: ["qa"]
    build:
      context: .
      dockerfile: Dockerfile.local
      args:
        INSTALL_DEV: "true"
    environment:
      APP_ENV: testing
      # Clave exclusiva y desechable para cifrado durante pruebas aisladas.
      # No sustituye ni expone la APP_KEY real del archivo .env.
      APP_KEY: "base64:Q7QpjCBrJw1KhDxKDm9qXCz1a3dr72nFKxMXIYfmRBE="
      CACHE_STORE: array
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      DENTISSA_ASISTENTE_IA_HABILITADA: "false"
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      # Credenciales ficticias y aisladas: permiten probar la autorización
      # de canales privados sin usar ni necesitar el servidor Reverb local.
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: dentissa-qa
      REVERB_APP_KEY: dentissa-qa-key
      REVERB_APP_SECRET: dentissa-qa-secret
      REVERB_HOST: localhost
      REVERB_PORT: 443
      REVERB_SCHEME: https
    command: ["sh", "/var/www/html/scripts/qa-frontend.sh"]

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dentissa}
      MYSQL_USER: ${MYSQL_USER:-dentissa}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dentissa_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dentissa_root_local}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/02-create-test-database.sh:/docker-entrypoint-initdb.d/02-create-test-database.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Prototipo opcional: no se inicia con `docker compose up` normal.
  # Solo se activa al usar `--profile ia` y mantiene el modelo en un volumen local.
  ollama:
    image: ollama/ollama:latest
    profiles: ["ia"]
    volumes:
      - ollama_data:/root/.ollama

volumes:
  mysql_data:
  ollama_data:
