    <path d="M394 104 Q394 74 424 74 H586 Q616 74 616 104 V150 H394 Z" fill="#3f7660"/>
    <circle cx="432" cy="126" r="16" fill="#ffffff"/>
    <path d="M432 116 C426 112 420 116 420 122 C421 128 424 131 425 137 C426 141 429 141 430 138 L431 132 Q432 131 433 132 L434 138 C435 141 438 141 439 137 C440 131 443 128 444 122 C444 116 438 112 432 116 Z" fill="#d75078"/>
