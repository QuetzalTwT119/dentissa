      <rect x="135" y="262" width="38" height="30" rx="6"/><rect x="235" y="262" width="38" height="30" rx="6"/><rect x="285" y="262" width="38" height="30" rx="6"/>
      <rect x="135" y="304" width="38" height="30" rx="6"/><rect x="185" y="304" width="38" height="30" rx="6"/><rect x="235" y="304" width="38" height="30" rx="6"/>
    </g>
    <rect x="185" y="262" width="38" height="30" rx="6" fill="#4e8d72"/>
    <path d="M195 277 l7 7 l12 -13" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

