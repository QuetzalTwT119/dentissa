  </defs>

  <rect width="800" height="760" fill="url(#fondo)"/>
  <circle cx="620" cy="140" r="150" fill="#ffffff" opacity=".45"/>
  <circle cx="150" cy="520" r="120" fill="#ffffff" opacity=".35"/>

  <!-- Todo el dibujo va en la mitad de arriba: abajo va el texto de la tarjeta. -->
  <g transform="translate(80 0) scale(0.8)">
  <!-- Calendario detrás -->
  <g transform="rotate(-10 230 260)">
    <rect x="110" y="140" width="240" height="230" rx="22" fill="#ffffff" stroke="#d9ebe1" stroke-width="4"/>
    <path d="M110 162 Q110 140 132 140 H328 Q350 140 350 162 V200 H110 Z" fill="#d75078"/>
