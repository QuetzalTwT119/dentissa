<svg xmlns="http://www.w3.org/2000/svg" width="800" height="760" viewBox="0 0 800 760" role="img" aria-labelledby="t">
  <title id="t">Ilustración: celular con el recordatorio de la cita por WhatsApp y los botones Confirmar y Reagendar</title>
  <defs>
